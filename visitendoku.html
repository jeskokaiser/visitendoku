<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitendokumentation Allgemeinchirurgie</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel-2:#eef2f6; --line:#d6dee7;
  --txt:#16202b; --txt-dim:#5d6b7a;
  --acc:#0b6bcb; --acc-soft:#e3f0ff; --acc-line:#8dc0f2;
  --ok:#0f7b52; --warn:#a8580a;
  --radius:11px;
  --tap:46px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151b; --panel:#18202a; --panel-2:#1f2937; --line:#2f3d4d;
    --txt:#e6edf4; --txt-dim:#94a5b8;
    --acc:#4d9bf0; --acc-soft:#12324f; --acc-line:#2f6fae;
    --ok:#3fbf8f; --warn:#e0a04a;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  height:100vh; height:100dvh;   /* vh als Rückfallebene für ältere Browser */
  -webkit-text-size-adjust:100%;
}
button,input,textarea{font:inherit; color:inherit}

/* ---------- Kopfzeile ---------- */
header{
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding-top:calc(8px + env(safe-area-inset-top));
}
header h1{font-size:16px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap}
header .sp{flex:1}
#datum{
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; min-height:38px;
}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.segb{
  min-width:44px; min-height:38px; border:0; border-right:1px solid var(--line);
  background:var(--panel-2); cursor:pointer; font-weight:800; letter-spacing:.02em;
}
.segb:last-child{border-right:0}
.segb.on{background:var(--acc); color:#fff}
.btn{
  border:1px solid var(--line); background:var(--panel-2); border-radius:8px;
  padding:8px 12px; min-height:38px; cursor:pointer; white-space:nowrap;
}
.btn:hover{border-color:var(--acc-line)}
.btn:active{transform:translateY(1px)}

/* ---------- Reiter ---------- */
nav{
  display:flex; gap:6px; padding:8px 12px; background:var(--bg);
  border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto; min-width:96px; min-height:var(--tap);
  border:1px solid var(--line); background:var(--panel); border-radius:var(--radius);
  cursor:pointer; padding:6px 12px; display:flex; align-items:center; justify-content:center; gap:7px;
  font-weight:600; color:var(--txt-dim);
}
.tab .k{font-size:17px; font-weight:800; color:var(--acc)}
.tab[aria-selected="true"]{background:var(--acc-soft); border-color:var(--acc-line); color:var(--txt)}
.tab .n{
  min-width:21px; height:21px; padding:0 6px; border-radius:11px; background:var(--acc); color:#fff;
  font-size:12px; font-weight:700; display:none; align-items:center; justify-content:center;
}
.tab .n.on{display:inline-flex}

/* ---------- Inhalt ---------- */
main{flex:1; min-height:0; overflow-y:auto; padding:12px 12px 18px; -webkit-overflow-scrolling:touch}
.grp{margin-bottom:16px}
.grp > h2{
  font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--txt-dim);
  margin:0 0 7px 2px; font-weight:700;
}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  display:inline-flex; align-items:center; flex-wrap:wrap; gap:6px;
  min-height:var(--tap); padding:7px 14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  transition:background .1s, border-color .1s;
}
.chip:hover{border-color:var(--acc-line)}
.chip.on{background:var(--acc-soft); border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc)}
.chip.on .lbl{font-weight:600}
.chip:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.chip .f{
  background:var(--panel); border:1px solid var(--acc-line); border-radius:7px;
  padding:5px 7px; min-height:36px; width:66px; text-align:center;
}
.chip .f.w{width:170px; text-align:left}
.chip .f.s{width:120px; text-align:left}
.chip .f:focus{outline:2px solid var(--acc); outline-offset:0}
.chip .f[type=number]{-moz-appearance:textfield}
.chip .f[type=number]::-webkit-outer-spin-button,
.chip .f[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.chip .cnt{font-size:12px; font-weight:800; color:var(--acc)}

/* Auswahlreihen innerhalb eines Bausteins bzw. Instanz-Block im Fremdmaterial */
.prow,.inst{
  flex-basis:100%; display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  border-top:1px dashed var(--acc-line); padding-top:7px; margin-top:2px;
}
.inst{flex-wrap:nowrap; flex-direction:column; align-items:stretch}
.irow{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.ihd{font-size:12px; color:var(--txt-dim); margin-right:2px; min-width:78px}
.pill{
  border:1px solid var(--line); background:var(--panel); border-radius:20px;
  padding:6px 13px; min-height:36px; font-size:13px; cursor:pointer;
  display:inline-flex; align-items:center; user-select:none;
}
.pill:hover{border-color:var(--acc-line)}
.pill.on{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600}
.pill.add{border-style:dashed; border-color:var(--acc-line); color:var(--acc); font-weight:600; flex-basis:100%; justify-content:center; margin-top:2px}
.pill.del{color:var(--warn); font-weight:800; padding:6px 13px}

.free{
  width:100%; margin-top:4px; min-height:64px; resize:vertical;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
}
.free:focus{outline:2px solid var(--acc); outline-offset:-1px; border-color:var(--acc)}

/* ---------- Vorschau ---------- */
footer{
  background:var(--panel); border-top:1px solid var(--line);
  display:flex; flex-direction:column; flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -3px 14px rgba(0,0,0,.09);
}
.grip{
  height:16px; flex:0 0 auto; cursor:ns-resize; touch-action:none;
  display:flex; align-items:center; justify-content:center;
}
.grip::before{content:""; width:48px; height:4px; border-radius:2px; background:var(--line)}
.grip:hover::before,.grip.drag::before{background:var(--acc)}
.fbar{display:flex; align-items:center; gap:8px; padding:2px 12px 6px; flex-wrap:wrap}
.fbar .ttl{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--txt-dim); font-weight:700}
.fbar .sp{flex:1}
.fbar .note{font-size:12px; color:var(--txt-dim); font-style:italic}
.fbar .warn{font-size:12px; color:var(--warn); font-weight:600}
#copy{
  background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700;
  min-height:var(--tap); padding:0 20px; font-size:15px;
}
#copy.done{background:var(--ok); border-color:var(--ok)}
#out{
  margin:0 12px 12px; padding:11px 13px; overflow:auto;
  height:190px; min-height:60px; resize:vertical;
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
  font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap;
}
#out:focus{outline:2px solid var(--acc); outline-offset:-1px}
#out.edit{background:var(--panel); border-color:var(--warn)}
#out .gap{                                   /* unausgefülltes Pflichtfeld */
  color:var(--warn); font-weight:800;
  background:rgba(230,126,34,.22); border-radius:3px; padding:0 2px;
}
#stage{position:fixed; left:-9999px; top:0; opacity:0; white-space:pre-wrap}

@media (max-width:560px){
  header h1{font-size:14px}
  #out{height:150px}
  .tab{min-width:72px; font-size:13px}
  .ihd{min-width:100%}
}
</style>
</head>
<body>

<header>
  <h1>Chirurgische Visite</h1>
  <input type="date" id="datum">
  <span class="seg" id="geschlecht" title="Anrede im Text">
    <button class="segb on" data-g="Patient">M</button>
    <button class="segb" data-g="Patientin">W</button>
  </span>
  <span class="sp"></span>
  <button class="btn" id="modus" title="Ausgabeformat umschalten">Fließtext</button>
  <button class="btn" id="reset">Zurücksetzen</button>
  <button class="btn" id="save" title="Diese Seite als HTML-Datei für die Nutzung ohne Internet speichern">⤓ Offline-Kopie</button>
</header>

<nav id="tabs"></nav>
<main id="main"></main>

<footer>
  <div class="grip" id="grip" title="Ziehen ändert die Höhe der Vorschau · Doppelklick setzt zurück"></div>
  <div class="fbar">
    <span class="ttl">Vorschau</span>
    <span class="note" id="hint">– noch keine Bausteine ausgewählt –</span>
    <span class="warn" id="edited" hidden>manuell bearbeitet · Klicks werden nicht mehr übernommen</span>
    <span class="warn" id="gaps" hidden></span>
    <span class="sp"></span>
    <button class="btn" id="resync" hidden>↻ Neu aufbauen</button>
    <button class="btn" id="copy">In Zwischenablage</button>
  </div>
  <div id="out" contenteditable="true"></div>
</footer>
<div id="stage" contenteditable="true"></div>

<script>
"use strict";

/* Unveränderte Kopie dieser Seite für den Offline-Download (vor dem ersten Rendern) */
const SELF = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

/* =======================================================================
   AUSWAHLLISTEN – werden als antippbare Schaltflächen dargestellt

  "der Pleura","zur Restharnbestimmung","der Halsweichteile"];

  "im Mittelbauch","epigastrisch","periumbilikal","suprapubisch","in der rechten Flanke","in der linken Flanke",
  "im Wundgebiet","über dem gesamten Abdomen","im McBurney-Punkt","im Nierenlager rechts","im Nierenlager links"];

/* Wiederverwendbare Felder der Schmerz-Bausteine: NRS bleibt optional, Intensität als Auswahl */

      {x:"schm", l:"Schmerzfrei", o:"Schmerzfrei"},

      {x:"schm", l:"Thoraxschmerzen", o:"{i} Thoraxschmerzen{n}", fields:[FNRS, FINT]},

    const n = countSec(s);
    return `<button class="tab" role="tab" data-s="${s}" aria-selected="${s===tab}">`+
           `<span class="k">${s==="M"?"FM":s}</span>`+
           `<span>${SECNAME[s]}</span>`+
           `<span class="n ${n?"on":""}">${n}</span></button>`;
  }).join("");
}
function countSec(s){
  let n = 0;
  if(s==="M"){ MATERIAL.forEach(g=>g.items.forEach(i=>{ if(sel[i.id]) n += sel[i.id].inst.length; })); }
  else { CATALOG[s].groups.forEach(g=>g.items.forEach(i=>{ if(sel[i.id]) n++; })); }
  if(free[s].trim()) n++;
  return n;
}

/* ======================= Bausteine rendern ======================= */
function fieldHTML(it, f){
  const v = sel[it.id].v[f.k] || "";
  if(f.t==="pills"){
    return `<span class="prow">`+
      (f.lb ? `<span class="ihd">${esc(f.lb)}:</span>` : "")+
      f.opts.map(o=>
        `<span class="pill${v===o?" on":""}" data-id="${it.id}" data-k="${f.k}" data-val="${esc(o)}">${esc(o)}</span>`
      ).join("")+`</span>`;
  }
  const cls = "f" + (f.w?" w":"") + (f.s?" s":"");
  return `<input class="${cls}" data-id="${it.id}" data-k="${f.k}" placeholder="${esc(f.ph||"")}" `+
         `value="${esc(v)}" type="${f.t==="num"?"number":"text"}" `+
         `inputmode="${f.t==="num"?"decimal":"text"}">`;
}

function chipHTML(it){
  const on = !!sel[it.id];
  let inner = `<span class="lbl">${esc(it.l)}</span>`;
  if(on && it.fields) inner += it.fields.map(f=>fieldHTML(it,f)).join("");
  return `<div class="chip${on?" on":""}" data-id="${it.id}" role="button" tabindex="0" aria-pressed="${on}">${inner}</div>`;
}

function instHTML(it, ins, n){
  const many = sel[it.id].inst.length > 1;
  const locs = it.loc.map(x=>
    `<span class="pill${ins.loc===x?" on":""}" data-id="${it.id}" data-n="${n}" data-loc="${esc(x)}">${esc(x)}</span>`).join("");
  const inds = it.ind.map(x=>
    `<span class="pill${ins.i[x]?" on":""}" data-id="${it.id}" data-n="${n}" data-ind="${esc(x)}">${esc(x)}</span>`).join("");
  return `<span class="inst">`+
    `<span class="irow"><span class="ihd">${many?"#"+(n+1)+" ":""}Lokalisation:</span>`+
      (many?`<span class="pill del" data-del="${it.id}" data-n="${n}" title="Diesen Eintrag entfernen">×</span>`:"")+
      locs+
      `<input class="f s" data-id="${it.id}" data-n="${n}" data-k="frei" type="text" placeholder="sonstige" value="${esc(ins.frei||"")}">`+
    `</span>`+
    `<span class="irow"><span class="ihd">Indikation:</span>${inds}`+
      `<input class="f s" data-id="${it.id}" data-n="${n}" data-k="indfrei" type="text" placeholder="weitere" value="${esc(ins.indfrei||"")}">`+
    `</span>`+
  `</span>`;
}

function matChipHTML(it){
  const st = sel[it.id], on = !!st;
  let inner = `<span class="lbl">${esc(it.l)}</span>`;
  if(on){
    if(st.inst.length>1) inner += `<span class="cnt">${st.inst.length}×</span>`;
    inner += st.inst.map((ins,n)=>instHTML(it,ins,n)).join("");
    inner += `<span class="pill add" data-add="${it.id}">+ weitere/r ${esc(it.l)}</span>`;
  }
  return `<div class="chip${on?" on":""}" data-id="${it.id}" role="button" tabindex="0" aria-pressed="${on}">${inner}</div>`;
}

function renderMain(){
  const mat = tab==="M";
  const groups = mat ? MATERIAL : CATALOG[tab].groups;
  $("#main").innerHTML = groups.map(g=>
    `<section class="grp"><h2>${esc(g.t)}</h2><div class="chips">`+
    g.items.map(it=> mat ? matChipHTML(it) : chipHTML(it)).join("")+`</div></section>`
  ).join("") +
  `<section class="grp"><h2>Freitext ${esc(SECNAME[tab])}</h2>`+
  `<textarea class="free" id="freetext" placeholder="Individuelle Ergänzung – wird an die ausgewählten Bausteine angehängt">${esc(free[tab])}</textarea></section>`;
}

function render(keepScroll){
  const y = keepScroll ? $("#main").scrollTop : 0;
  renderTabs(); renderMain(); $("#main").scrollTop = y;
  update();
}

/* ======================= Interaktion ======================= */
function findItem(id){
  if(id[0]==="M"){ for(const g of MATERIAL) for(const i of g.items) if(i.id===id) return i; }
  else { for(const g of CATALOG[id[0]].groups) for(const i of g.items) if(i.id===id) return i; }
  return null;
}
const newInst = ()=> ({loc:"", frei:"", indfrei:"", i:{}});

function toggle(id){
  const it = findItem(id);
  if(sel[id]){ delete sel[id]; }
  else if(id[0]==="M"){ sel[id] = {inst:[newInst()]}; }
  else{
    if(it.x){ // Ausschluss innerhalb der Gruppe
      CATALOG[id[0]].groups.forEach(g=>g.items.forEach(o=>{ if(o.x===it.x && sel[o.id]) delete sel[o.id]; }));
    }
    sel[id] = {v:{}};
    (it.fields||[]).forEach(f=>{ if(f.dv) sel[id].v[f.k] = f.dv; });
  }
  render(true);
  const el = document.querySelector(`.chip[data-id="${id}"] .f`);
  if(el && id[0]!=="M") el.focus();
}

$("#main").addEventListener("click", e=>{
  const add = e.target.closest("[data-add]");
  if(add){ sel[add.dataset.add].inst.push(newInst()); render(true); return; }

  const del = e.target.closest("[data-del]");
  if(del){
    const st = sel[del.dataset.del];
    st.inst.splice(+del.dataset.n, 1);
    if(!st.inst.length) delete sel[del.dataset.del];
    render(true); return;
  }

  const pill = e.target.closest(".pill");
  if(pill && pill.dataset.id){
    if(pill.dataset.n !== undefined){          // Fremdmaterial-Instanz
      const ins = sel[pill.dataset.id].inst[+pill.dataset.n];
      if(pill.dataset.loc !== undefined) ins.loc = (ins.loc===pill.dataset.loc) ? "" : pill.dataset.loc;
      else { const k = pill.dataset.ind; ins.i[k] ? delete ins.i[k] : ins.i[k]=true; }
    } else {                                    // Auswahl in einem Baustein
      const v = sel[pill.dataset.id].v, k = pill.dataset.k;
      v[k] = (v[k]===pill.dataset.val) ? "" : pill.dataset.val;
    }
    render(true); return;
  }

  if(e.target.closest(".f") || e.target.closest(".free")) return;
  const chip = e.target.closest(".chip");
  if(chip) toggle(chip.dataset.id);
});

$("#main").addEventListener("keydown", e=>{
  if(e.target.classList.contains("chip") && (e.key==="Enter"||e.key===" ")){
    e.preventDefault(); toggle(e.target.dataset.id);
  }
});

$("#main").addEventListener("input", e=>{
  if(e.target.id==="freetext"){ free[tab]=e.target.value; renderTabs(); update(); return; }
  if(!e.target.classList.contains("f")) return;
  const st = sel[e.target.dataset.id];
  if(!st) return;
  if(e.target.dataset.n !== undefined) st.inst[+e.target.dataset.n][e.target.dataset.k] = e.target.value;
  else st.v[e.target.dataset.k] = e.target.value;
  update();
});

$("#tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab");
  if(t){ tab = t.dataset.s; render(false); }
});

/* ======================= Textaufbau ======================= */
function clean(s){
  return s.replace(/\s+/g," ").replace(/\(\s*\)/g,"").replace(/\s+([,.;:])/g,"$1")
          .replace(/,\s*$/,"").replace(/\s+/g," ").trim();
}

function itemText(it){
  const v = sel[it.id].v;
  const fmap = {}; (it.fields||[]).forEach(f=>fmap[f.k]=f);
  return clean((it.o||it.l).replace(/\{(\w+)\}/g, (m,k)=>{
    if(k==="P") return gesch;
    const f = fmap[k], x = (v[k]||"").trim();
    if(x) return ((f&&f.pre)||"") + x + ((f&&f.suf)||"");   // pre/suf nur bei gefülltem Feld
    return (f && f.opt) ? "" : "___";
  }));
}

function matTexts(it){
  return sel[it.id].inst.map(ins=>{
    const det = [];
    if(ins.loc) det.push(ins.loc);
    if((ins.frei||"").trim()) det.push(ins.frei.trim());
    const ind = Object.keys(ins.i);
    if((ins.indfrei||"").trim()) ind.push(ins.indfrei.trim());
    let s = it.o + (det.length ? " ("+det.join(", ")+")" : "");
    if(ind.length) s += " für " + ind.join(", ");
    return s;
  });
}

function partsOf(s){
  const out = [];
  if(s==="M"){ MATERIAL.forEach(g=>g.items.forEach(i=>{ if(sel[i.id]) out.push(...matTexts(i)); })); }
  else { CATALOG[s].groups.forEach(g=>g.items.forEach(i=>{ if(sel[i.id]) out.push(itemText(i)); })); }
  const f = free[s].trim();
  if(f) f.split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(x=>out.push(x.replace(/\.$/,"")));
  return out;
}

function datumStr(){
  const d = $("#datum").value;
  if(!d) return "";
  const [y,m,t] = d.split("-");
  return `${t}.${m}.${y}`;
}

/* Baut den Text; im Fließtext-Modus ohne Leerzeilen */
function plain(){
  const L = ["Chirurgische Visite vom "+datumStr()];
  if(!fliess) L.push("");
  ["S","O","A","P"].forEach(s=>{
    const p = partsOf(s);
    if(!p.length) return;
    if(fliess){ L.push(s+": "+p.join(". ")+"."); }
    else{
      L.push(s+" – "+SECNAME[s]+":");
      p.forEach(x=>L.push("- "+x));
    }
  });
  const m = partsOf("M");
  if(m.length){
    if(!fliess) L.push("");
    L.push("Einliegendes Fremdmaterial:");
    m.forEach(x=>L.push("- "+x));
  }
  return L.join("\n");
}

/* Erste nicht-leere Zeile = Überschrift (fett + unterstrichen) */
function htmlFromText(t){
  let head = false;
  return t.split("\n").map(l=>{
    if(!l.trim()) return "<div><br></div>";
    if(!head){ head = true; return `<div><b><u>${esc(l)}</u></b></div>`; }
    return `<div>${esc(l)}</div>`;
  }).join("");
}

const currentText = ()=> dirty ? $("#out").innerText.replace(/\n+$/,"") : plain();

function leer(){ return !SEC.some(s=>partsOf(s).length); }

/* Anzeigefassung: wie die Kopierfassung, nur mit hervorgehobenen Lücken.
   Die Markierung entsteht erst nach dem Escapen und bleibt auf die Anzeige beschränkt. */
function anzeigeHTML(t){ return htmlFromText(t).replace(/___/g, '<span class="gap">___</span>'); }

/* Zählt unausgefüllte Pflichtfelder – auch bei von Hand bearbeiteter Vorschau */
function zaehleLuecken(){
  const n = (currentText().match(/___/g) || []).length;
  const el = $("#gaps");
  el.hidden = !n;
  el.textContent = n===1 ? "1 Lücke offen" : n+" Lücken offen";
}

function update(){
  $("#hint").hidden = dirty || !leer();
  if(!dirty) $("#out").innerHTML = anzeigeHTML(plain());
  zaehleLuecken();
}

/* Vorschau von Hand bearbeitet → Aufbau anhalten, bis „Neu aufbauen“ */
$("#out").addEventListener("input", ()=>{
  if(!dirty){
    dirty = true;
    $("#out").classList.add("edit");
    $("#edited").hidden = false;
    $("#resync").hidden = false;
    $("#hint").hidden = true;
  }
  zaehleLuecken();          // kein Neuaufbau des Feldes – der Cursor bleibt stehen
});
function resync(){
  dirty = false;
  $("#out").classList.remove("edit");
  $("#edited").hidden = true;
  $("#resync").hidden = true;
  update();
}
$("#resync").addEventListener("click", resync);

/* ======================= Zwischenablage ======================= */
async function copy(){
  const p = currentText()+"\n", h = htmlFromText(currentText());
  let ok = false;
  try{
    if(navigator.clipboard && window.ClipboardItem && window.isSecureContext){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([h], {type:"text/html"}),
        "text/plain": new Blob([p], {type:"text/plain"})
      })]);
      ok = true;
    }
  }catch(e){ /* Fallback unten */ }

  if(!ok){ // Fallback für file:// – kopiert ebenfalls formatiert + reinen Text
    const st = $("#stage");
    st.innerHTML = h; st.focus();
    const r = document.createRange(); r.selectNodeContents(st);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    s.removeAllRanges(); st.innerHTML = "";
  }

  if(!ok){ // Letzter Ausweg: Vorschau markieren, damit ⌘/Strg+C reicht
    const r = document.createRange(); r.selectNodeContents($("#out"));
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  const b = $("#copy");
  b.textContent = ok ? "✓ Kopiert" : "Markiert – jetzt ⌘/Strg+C";
  b.classList.toggle("done", ok);
  setTimeout(()=>{ b.textContent = "In Zwischenablage"; b.classList.remove("done"); }, ok?1800:4000);
}
$("#copy").addEventListener("click", copy);

/* ======================= Steuerung ======================= */
$("#geschlecht").addEventListener("click", e=>{
  const b = e.target.closest(".segb");
  if(!b) return;
  gesch = b.dataset.g;
  [...$("#geschlecht").children].forEach(c=>c.classList.toggle("on", c===b));
  update();
});
$("#modus").addEventListener("click", ()=>{
  fliess = !fliess;
  $("#modus").textContent = fliess ? "Fließtext" : "Stichpunkte";
  update();
});
$("#reset").addEventListener("click", ()=>{
  if(!confirm("Alle Eingaben verwerfen?")) return;
  Object.keys(sel).forEach(k=>delete sel[k]);
  SEC.forEach(s=>free[s]="");
  tab = "S";
  resync();
  render(false);
});
$("#datum").addEventListener("change", update);

/* Höhe der Vorschau per Griffleiste ziehen (Maus, Stift und Touch) */
(function(){
  const grip = $("#grip"), out = $("#out"), fbar = document.querySelector(".fbar");
  const STD = 190;                       // Ausgangshöhe, auch Ziel des Doppelklicks
  let y0 = 0, h0 = 0, drag = false, moved = false;

  /* Obergrenze aus den echten Leistenhöhen, damit mindestens ein Streifen
     Bausteine sichtbar bleibt und nichts aus dem Fenster läuft. */
  function grenze(h){
    const belegt = document.querySelector("header").offsetHeight
                 + document.querySelector("nav").offsetHeight
                 + grip.offsetHeight + fbar.offsetHeight
                 + (out.offsetHeight - out.clientHeight) + 24;   // Rahmen und Abstände
    return Math.max(60, Math.min(document.documentElement.clientHeight - belegt - 120, h));
  }
  const setze = h => { out.style.height = grenze(h) + "px"; };

  grip.addEventListener("pointerdown", e=>{
    drag = true; moved = false; y0 = e.clientY; h0 = out.offsetHeight;
    grip.classList.add("drag"); grip.setPointerCapture(e.pointerId); e.preventDefault();
  });
  grip.addEventListener("pointermove", e=>{
    if(!drag) return;
    if(Math.abs(e.clientY - y0) > 2) moved = true;
    if(moved) setze(h0 - (e.clientY - y0));
  });
  const ende = ()=>{ drag = false; grip.classList.remove("drag"); };
  grip.addEventListener("pointerup", ende);
  grip.addEventListener("pointercancel", ende);
  grip.addEventListener("dblclick", ()=>{ ende(); setze(STD); });
  window.addEventListener("resize", ()=> setze(out.offsetHeight));
})();

/* Offline-Kopie dieser Seite herunterladen */
$("#save").addEventListener("click", ()=>{
  const url = URL.createObjectURL(new Blob([SELF], {type:"text/html;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = "visitendokumentation.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
});

document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); copy(); }
});

/* Nichts wird gespeichert – deshalb vor dem Verlassen warnen, solange etwas erfasst ist.
   Der Download der Offline-Kopie löst das nicht aus. */
window.addEventListener("beforeunload", e=>{
  if(dirty || !leer()){ e.preventDefault(); e.returnValue = ""; }
});

/* Start */
(function init(){
  const d = new Date();
  $("#datum").value = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  render(false);
})();
</script>
